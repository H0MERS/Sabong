name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Android MAUI workload
        run: dotnet workload install maui-android
      - name: Build installable debug APK
        run: dotnet publish SabongWifiPoc/SabongWifiPoc.csproj -f net10.0-android -c Debug -p:AndroidPackageFormat=apk -p:AndroidSdkDirectory=$ANDROID_HOME -o ./apk-output
      - uses: actions/upload-artifact@v4
        with:
          name: Sabong-Android-APK
          path: apk-output/*.apk
          if-no-files-found: error
